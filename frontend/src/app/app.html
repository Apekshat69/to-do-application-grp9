<app-toast></app-toast>

@if (!authService.isAuthenticated() || isLoginPage) {
  <router-outlet></router-outlet>
} @else {
  <div class="min-h-screen bg-[#F8F7FD] flex font-sans text-[#1E1B4B] antialiased">
    <!-- Left Sidebar -->
    <app-sidebar [isOpen]="isSidebarOpen" (close)="isSidebarOpen = false"></app-sidebar>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
      <app-header (openSidebar)="isSidebarOpen = true"></app-header>

      <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
        <router-outlet></router-outlet>
      </main>
    </div>

    <!-- Global Task Creation / Edit Modal -->
    <app-task-form-modal></app-task-form-modal>
  </div>
}
